{% extends 'base.html' %}

<!-- html content starts here -->
{% block content %} 

{% load static %} 

{% load crispy_forms_tags %}

<div class="container">
    <div class="row mt-4">
        <div class="col-md-10 offset-md-1">
            <h3>Map</h3>
            {{ map | safe }}
        </div>

        <div class="container w-50 d-flex flex-row-reverse">
        <form class="form-inline my-2 my-lg-0" method="POST">
            {% csrf_token %} 
            {{ form | crispy }}
            <button
                class="btn btn-outline-success my-2 my-sm-0 mx-3"
                type="submit">
                Search
            </button>
        </form>
        </div>

    </div>
</div>

<!-- index.html content ends here -->
{% endblock %}
