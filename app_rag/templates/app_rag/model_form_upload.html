{% extends 'base.html' %}
{% block content %}
{% load static %}
{% load crispy_forms_tags %}



<div class="container justify-content-center">
  <div class="row">
    <form method="post" enctype="multipart/form-data" class="mt-5 py-5 text-bg-primary">
      
        {% csrf_token %}
    
        {{ form }}
    
        <button type="submit" class="btn btn-primary">
            Upload
        </button>
    
    </form>
  </div>
</div>


{% endblock %}
