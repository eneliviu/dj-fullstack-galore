<div class="container">
<div class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
        <div class="toast-body">
            {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show" id="msg" role="alert">
                    {{ message | safe }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    </div>
</div>

<!-- Modal -->
<div class='row'>
    <div class='col-4'>
        <!-- Button trigger modal -->
        <div class="container">
            <form action = "" method = "POST">
                {% csrf_token %}
                {{ form | crispy }}
                <input type="submit" value="Submit" class="btn btn-outline-primary">  
                <button type="button" class="btn btn-secondary float-end" data-bs-dismiss="modal">Close</button>
            </form>
        </div>
                   
    </div>

    <div class='col-8'>
        <div id="map" style="height: 500px; width: 500px;" class="container mt-5"></div>
    </div>
 </div>



{{ trips | json_script:"trips_json" }}

<script type='text/javascript'>
    
    let locations = JSON.parse(document.getElementById('trips_json').textContent);
    //console.log(locations)
   
    var map = L.map('map').setView([60, 9], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
    
            
    const markers = L.markerClusterGroup();
      
    arrayOfLatLngs = []
    locations.forEach( element => {
        console.log(element)
        const marker = L.marker([element.lat, element.lon])
        markers.addLayer(marker);
    })

    //markers.addTo(map)
    map.addLayer(markers)

    var bounds = markers.getBounds();
    if (bounds.isValid()) {
        map.fitBounds(bounds, maxZoom=11);
    }

</script>


<!-- index.html content ends here -->
{% endblock %}
